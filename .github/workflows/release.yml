name: Release

# Pushing a tag vX.Y.Z (matching the version in pyproject.toml) runs the CI checks, publishes the
# Docker image to ghcr.io/<owner>/laundry-booking (amd64 + arm64) and creates the GitHub release.
# A pre-release tag such as v1.6.0-beta.1 (for trying a version on staging) gets only its exact image
# tag, not X.Y, X or latest, and a GitHub release marked as pre-release. Its notes are the message of
# the tag if it is annotated (git tag -a --cleanup=verbatim v1.6.0-beta.1 -F notes.md; without
# --cleanup=verbatim git drops Markdown headings as comments): generated notes only list merged PRs, and
# a beta usually comes from a PR that isn't merged yet.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches pyproject.toml version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest; v1.2.3-beta.1 -> only 1.2.3-beta.1 (the action
          # skips the shorter patterns and latest for pre-releases)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*)
              flags=(--prerelease)
              # An annotated tag points to a tag object (with the message), a lightweight one to the commit
              ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
              if [ "$(gh api "$ref" --jq .object.type)" = tag ]; then
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$(gh api "$ref" --jq .object.sha)" --jq .message > notes.md
                notes=(--notes-file notes.md)
              fi
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            "${notes[@]}" "${flags[@]}"
