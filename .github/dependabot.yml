# Weekly update PRs for the pinned Python packages and the GitHub Actions (pinned by commit SHA;
# Dependabot updates the SHA and the version comment). One grouped PR per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
