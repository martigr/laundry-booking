{% extends 'base.html' %}
{% block title %}Profil – Waschküche{% endblock %}
{% block content %}
<div class="narrow" style="display:flex;flex-direction:column;gap:20px">
  <div class="page-head">
    <div>
      <div class="kicker">Angemeldet als {{ g.user['username'] }}</div>
      <h1>Profil</h1>
    </div>
  </div>

  <form class="card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="name">
    <h2>Anzeigename</h2>
    <div class="field">
      <label for="display_name">So sehen dich die anderen im Kalender</label>
      <input type="text" id="display_name" name="display_name" value="{{ g.user['display_name'] }}" maxlength="40" required>
    </div>
    <div><button type="submit" class="btn btn-dark">Speichern</button></div>
  </form>

  <form class="card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="password">
    <h2>Passwort ändern</h2>
    <div class="field">
      <label for="old_password">Aktuelles Passwort</label>
      <input type="password" id="old_password" name="old_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">Neues Passwort</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="{{ min_pw }}" required>
      <span class="hint">Mindestens {{ min_pw }} Zeichen.</span>
    </div>
    <div><button type="submit" class="btn btn-dark">Passwort ändern</button></div>
  </form>
</div>
{% endblock %}
