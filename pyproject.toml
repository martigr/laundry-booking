[project]
name = "laundry-booking"
version = "1.6.0-beta.4"
description = "Laundry room booking for a shared washing machine"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
